# ============================================================================
# Nginx reverse proxy untuk FnB Digital (VPS + PM2).
#
# Pasang:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fnbtech
#   sudo ln -s /etc/nginx/sites-available/fnbtech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fnbtech.biz.id -d www.fnbtech.biz.id
#
# Setelah certbot, blok `listen 443 ssl` ditambahkan otomatis oleh certbot.
# ============================================================================

upstream fnb_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name fnbtech.biz.id www.fnbtech.biz.id;

    # Bukti transfer & foto menu (ubah bila perlu lebih besar).
    client_max_body_size 10m;

    # Jangan bocorkan versi Nginx.
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aset Next.js ber-hash: aman di-cache lama.
    location /_next/static/ {
        proxy_pass http://fnb_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://fnb_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
